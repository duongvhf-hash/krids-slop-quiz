<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slop Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:white;background:#795333}
button{font-family:inherit;color:white;cursor:pointer;transition:none!important;animation:none!important;-webkit-tap-highlight-color:transparent}
#viewport{position:fixed;inset:0;overflow:hidden}
#camera{position:absolute;inset:0 auto 0 0;width:400vw;height:100%;display:flex;transform:translateX(0);transition:transform 850ms linear;will-change:transform}
.scene{position:relative;flex:0 0 100vw;width:100vw;height:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;display:flex;background:url("woodic.png") center/cover no-repeat}

/* MENU */
.menuContent{position:absolute;top:0;bottom:0;left:0;width:min(440px,100%);padding:clamp(14px,3.5vw,42px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:12px;overflow-y:auto}
#logo{display:block;width:min(370px,100%);max-height:220px;object-fit:contain;object-position:left center;margin-bottom:20px}
.gameButton{width:100%;min-height:clamp(46px,8vh,64px);padding:10px 14px;border:2px solid #49301e;border-radius:6px;background:#805632;color:#fff1dc;font-size:clamp(13px,2vw,18px);text-align:center}
.gameButton:hover,.gameButton:active{background:#805632;transform:none;filter:none}
.gameButton:disabled{opacity:.45;cursor:not-allowed}
#worldList{width:100%;display:flex;flex-direction:column;gap:12px}
.worldButton{text-align:left;padding-left:18px}

/* QUIZ */
#quizScene{align-items:center;justify-content:center}
#quizContent{width:min(1150px,96vw);margin:auto;padding:clamp(12px,3vh,30px) 12px calc(125px + env(safe-area-inset-bottom));text-align:center}
#quizHeader{display:flex;justify-content:center;align-items:center;width:100%;margin-bottom:clamp(15px,3vh,27px)}
#questionCounter{font-size:clamp(22px,3vw,31px);font-weight:bold;text-align:center}
#questionText{font-size:clamp(22px,3.8vw,37px);line-height:1.35;margin:20px auto 28px;max-width:1100px;overflow-wrap:anywhere;white-space:pre-line}
#questionMedia{display:none;width:100%;margin:0 auto 20px}
#questionMedia img{display:block;width:min(100%,700px);max-height:38vh;object-fit:contain;margin:auto;border-radius:7px}
#answerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;width:100%;max-width:1100px;margin:auto}
.answerButton{position:relative;isolation:isolate;overflow:hidden;width:100%;min-width:0;min-height:clamp(68px,11vh,100px);padding:10px;background:#805632;color:white;border:2px solid #49301e;border-radius:7px;font-size:clamp(15px,2.2vw,21px);overflow-wrap:anywhere}
.answerButton:hover,.answerButton:active{background:#805632;transform:none}
.answerButton:disabled{opacity:1;cursor:default}
.answerButton .answerLabel{position:relative;z-index:2;pointer-events:none}
.answerButton .answerFeedbackImage{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;object-fit:fill;border-radius:5px;pointer-events:none}

/* BOMB */
#bombHud{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.5vw,12px);pointer-events:none;z-index:10}
#bombHud img{width:clamp(38px,7vw,62px);height:clamp(38px,7vw,62px);object-fit:contain}
#timerText{font-family:monospace;font-size:clamp(21px,4vw,31px);font-weight:bold;white-space:nowrap}
#timerText.urgent{color:#ff5555}

/* HEARTS */
#heartCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}

/* JUMPSCARE */
#jumpscareOverlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:transparent;overflow:hidden;pointer-events:none}
#jumpscareOverlay img{
    display:block;
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    object-fit:cover;
}

/* SECRET QUESTION */
#specialEventOverlay{position:absolute;inset:0;z-index:25;display:none;pointer-events:none}
#specialGun{position:absolute;width:clamp(100px,17vw,155px);height:auto;left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) rotate(var(--gun-angle,0deg));transition:opacity .55s linear;overflow:visible}
#specialGun.visible{opacity:1}

/* DEATH SCREEN */
#endingScene{align-items:center;justify-content:center}
#deathShade{position:absolute;inset:0;background:#000;opacity:0;z-index:1;pointer-events:none;transition:opacity 1.2s ease}
#endingContent{position:relative;z-index:2;width:min(1050px,94vw);max-height:100%;overflow-y:auto;padding:clamp(12px,3vw,30px);text-align:center}
#deathPanel,#successPanel{display:none}
.deathLayout{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,55px);width:100%;text-align:left}
#civilianImage{display:block;width:clamp(150px,32vw,360px);max-height:60vh;object-fit:contain;opacity:0;flex-shrink:0}
.deathText{flex:1;min-width:0;opacity:0;visibility:hidden}
#deathTitle{font-family:"Arimo",Arial,sans-serif;font-size:clamp(38px,7vw,82px);font-weight:700;color:white;margin-bottom:18px}
#deathMessage{font-family:"Arimo",Arial,sans-serif;font-weight:400;color:#ddd;font-size:clamp(14px,2.5vw,23px);line-height:1.45;max-width:440px}
#endingScene.deathVisible #deathShade{opacity:1}
#endingScene.deathVisible #civilianImage{animation:civilianAppear 900ms ease-out 800ms both}
#endingScene.deathVisible .deathText{animation:deathTextAppear 700ms ease-out 2200ms both}
@keyframes civilianAppear{from{opacity:0;transform:translateX(-25px)}to{opacity:1;transform:translateX(0)}}
@keyframes deathTextAppear{0%{opacity:0;visibility:hidden;transform:translateX(25px)}1%{visibility:visible}100%{opacity:1;visibility:visible;transform:translateX(0)}}

/* ENDING BUTTONS */
#endingButtons{display:flex;flex-direction:column;gap:9px;width:min(330px,85%);margin:24px auto 0;opacity:0}
#endingScene.deathVisible #endingButtons{animation:buttonsAppear .5s ease-out 3.9s forwards}
@keyframes buttonsAppear{to{opacity:1}}
#endingButtons .gameButton{min-height:48px}

/* ANSWER REVIEW */
#successPanel h1{font-size:clamp(32px,6vw,60px);margin:5px 0 15px}
#successPanel h2{font-size:clamp(17px,3vw,24px)}
#answerResults{width:100%;max-height:55vh;overflow-y:auto;text-align:left;padding:8px;background:rgba(0,0,0,.35);border-radius:6px}
.resultItem{padding:12px;border-bottom:1px solid rgba(255,255,255,.2);overflow-wrap:anywhere}
.resultQuestion{font-weight:bold;margin-bottom:8px}
.resultYourAnswer{margin-bottom:4px;color:#ffe0b0}
.resultCorrectAnswer{color:#a9e69c}
.resultItem.incorrect .resultYourAnswer{color:#ff9999}

/* RESPONSIVE */
@media(max-width:550px){
    .menuContent{width:min(390px,100%);padding:18px}
    #logo{width:min(300px,90%);max-height:170px}
    #answerGrid{grid-template-columns:1fr;gap:9px}
    .answerButton{min-height:65px}
    #quizContent{padding-top:12px}
    #questionText{font-size:clamp(20px,5vw,28px)}
    #questionMedia img{max-height:26vh}
    .deathLayout{gap:12px}

@media(max-width:370px){

    #deathTitle{font-size:37px}

@media(max-height:520px){
    .menuContent{padding-top:8px;padding-bottom:8px;gap:6px}
    #logo{max-height:100px;margin-bottom:5px}
    #quizContent{padding-top:8px;padding-bottom:90px}
    #questionText{margin:10px 0 13px}
    .answerButton{min-height:48px}
    #bombHud{bottom:4px}
    #questionMedia img{max-height:22vh}
}

/* =====================================================
   AUDIO
===================================================== */

const music=new Audio(CONFIG.sounds.music);
music.loop=true;
music.volume=CONFIG.musicVolume;
music.preload="auto";

const deathMusic=new Audio(CONFIG.sounds.deathMusic);
deathMusic.loop=true;
deathMusic.volume=CONFIG.deathMusicVolume;
deathMusic.preload="auto";

let hurtSound=null;
let jumpscareSound=null;
let deathSequenceToken=0;

function stopJumpscareSound(){
    if(jumpscareSound){
        jumpscareSound.pause();
        jumpscareSound.currentTime=0;
        jumpscareSound=null;
    }
}

function stopHurtSound(){
    if(hurtSound){
        hurtSound.pause();
        hurtSound.currentTime=0;
        hurtSound=null;
    }
}

function playRandomHurtSound(){
    stopHurtSound();
    hurtSound=playSound(randomItem(CONFIG.sounds.hurtSounds));
}

function playSound(filename,volume=1){
    const sound=new Audio(filename);
    sound.volume=volume;
    sound.preload="auto";
    sound.play().catch(error=>console.warn("Could not play:",filename,error));
    return sound;
}

function playSoundAndWait(filename,volume=1){
    return new Promise(resolve=>{
        const sound=new Audio(filename);
        let finished=false;

        function finish(){
            if(finished)return;
            finished=true;
            sound.removeEventListener("ended",finish);
            sound.removeEventListener("error",finish);
            resolve();
        }

        sound.volume=volume;
        sound.preload="auto";
        sound.addEventListener("ended",finish);
        sound.addEventListener("error",finish);
        sound.play().catch(finish);
    });
}

async function playSoundsAndWait(filenames){
    await Promise.all(filenames.map(filename=>playSoundAndWait(filename)));
}

function delay(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function getGifFirstLoopDuration(bytes){
    if(!bytes||bytes.length<13)return null;

    const signature=String.fromCharCode(...bytes.slice(0,6));
    if(signature!=="GIF87a"&&signature!=="GIF89a")return null;

    let offset=13;
    const screenPacked=bytes[10];

    if(screenPacked&0x80){
        const globalTableSize=3*(1<<((screenPacked&0x07)+1));
        offset+=globalTableSize;
    }

    let pendingDelay=100;
    let totalDuration=0;
    let frameCount=0;

    function skipSubBlocks(){
        while(offset<bytes.length){
            const size=bytes[offset++];
            if(size===0)return true;
            offset+=size;
            if(offset>bytes.length)return false;
        }
        return false;
    }

    while(offset<bytes.length){
        const marker=bytes[offset++];

        if(marker===0x3B)break;

        if(marker===0x21){
            if(offset>=bytes.length)break;
            const label=bytes[offset++];

            if(label===0xF9){
                if(offset>=bytes.length)break;
                const blockSize=bytes[offset++];

                if(blockSize>=4&&offset+blockSize<=bytes.length){
                    const delayCentiseconds=bytes[offset+1]|(bytes[offset+2]<<8);
                    pendingDelay=delayCentiseconds>0?delayCentiseconds*10:100;
                }

                offset+=blockSize;
                if(bytes[offset]===0)offset++;
            }else{
                if(!skipSubBlocks())break;
            }
            continue;
        }

        if(marker===0x2C){
            if(offset+9>bytes.length)break;
            const imagePacked=bytes[offset+8];
            offset+=9;

            if(imagePacked&0x80){
                const localTableSize=3*(1<<((imagePacked&0x07)+1));
                offset+=localTableSize;
            }

            if(offset>=bytes.length)break;
            offset++;

            if(!skipSubBlocks())break;

            totalDuration+=pendingDelay;
            frameCount++;
            pendingDelay=100;
            continue;
        }

        break;
    }

    return frameCount>0&&totalDuration>0?totalDuration:null;
}

async function getJumpscareDuration(){
    try{
        const response=await fetch(CONFIG.images.jumpscare,{cache:"no-store"});
        if(!response.ok)throw new Error("Could not read jumpscare GIF metadata");
        const bytes=new Uint8Array(await response.arrayBuffer());
        const duration=getGifFirstLoopDuration(bytes);
        return duration||CONFIG.jumpscareDuration;
    }catch(error){
        return CONFIG.jumpscareDuration;
    }
}

async function playJumpscare(){
    const overlay=document.getElementById("jumpscareOverlay");
    const image=document.getElementById("jumpscareImage");
    const duration=await getJumpscareDuration();

    return new Promise(resolve=>{
        let finished=false;
        let finishTimer=null;

        function finish(){
            if(finished)return;
            finished=true;
            clearTimeout(finishTimer);
            overlay.style.display="none";
            image.onload=null;
            image.onerror=null;
            image.removeAttribute("src");
            stopJumpscareSound();
            resolve();
        }

        function startPlayback(){
            if(finished)return;
            stopJumpscareSound();
            jumpscareSound=playSound(CONFIG.sounds.jumpscare);
            finishTimer=setTimeout(finish,duration);
        }

        overlay.style.display="flex";
        image.onload=startPlayback;
        image.onerror=()=>{
            console.warn("Could not load jumpscare.gif");
            startPlayback();
        };
        image.removeAttribute("src");
        requestAnimationFrame(()=>{
            image.src=CONFIG.images.jumpscare;
        });
    });
}

function startMusic(){
    stopDeathMusic();
    music.pause();
    music.currentTime=0;
    music.volume=CONFIG.musicVolume;
    music.play().catch(error=>console.warn("Music playback failed:",error));
}

function stopMusic(){
    music.pause();
    music.currentTime=0;
}

function startDeathMusic(){
    stopMusic();
    deathMusic.pause();
    deathMusic.currentTime=0;
    deathMusic.volume=CONFIG.deathMusicVolume;
    deathMusic.play().catch(error=>console.warn("Memorian music failed:",error));
}

function stopDeathMusic(){
    deathMusic.pause();
    deathMusic.currentTime=0;
}


/* =====================================================
   UTILITIES
===================================================== */

function shuffle(array){
    const result=[...array];

    for(let i=result.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [result[i],result[j]]=[result[j],result[i]];
    }

    return result;
}

function randomItem(array){
    return array[Math.floor(Math.random()*array.length)];
}

function getWrongAnswers(pool,answer){
    return shuffle(pool.filter(item=>item!==answer)).slice(0,3);
}



/* =====================================================
   QUESTION BANK — FLEXIBLE QUESTION COUNTS
===================================================== */

const QUESTION_BANK=[];

function addQuestion(question,answer,wrongAnswers,topic){
    const wrong=[...new Set(wrongAnswers.filter(item=>item!==answer))].slice(0,3);

    if(wrong.length!==3)throw new Error("Invalid choices: "+question);

    QUESTION_BANK.push({
        id:QUESTION_BANK.length+1,
        question,
        answer,
        choices:shuffle([answer,...wrong]),
        topic
    });
}

function addPairQuestions(q1,q2,answer,wrong,topic){
    addQuestion(q1,answer,wrong,topic);
    addQuestion(q2,answer,wrong,topic);
}

function addOddOneOut(question,words,answer,topic){
    const others=words.filter(w=>w!==answer);
    if(others.length!==3)throw new Error("Invalid odd-one-out: "+question);
    addQuestion(question,answer,others,topic);
}

/* =====================================================
   DRAWN HEARTS AND PHYSICS
===================================================== */

const heartCanvas=document.getElementById("heartCanvas");
const heartCtx=heartCanvas.getContext("2d");

let canvasWidth=window.innerWidth;
let canvasHeight=window.innerHeight;
let canvasDPR=Math.min(window.devicePixelRatio||1,2);

let heartsAlive=[true,true,true];
let heartFragments=[];
let heartAnimationFrame=null;
let lastHeartFrame=0;

/*
   Cache the heart shard images.
   Previously, every wrong answer created several new canvases.
   Now the images are generated once and reused.
*/
const heartShardCache=new Map();

function resizeHeartCanvas(){
    canvasWidth=window.innerWidth;
    canvasHeight=window.innerHeight;
    canvasDPR=Math.min(window.devicePixelRatio||1,2);

    heartCanvas.width=Math.round(canvasWidth*canvasDPR);
    heartCanvas.height=Math.round(canvasHeight*canvasDPR);
    heartCanvas.style.width=canvasWidth+"px";
    heartCanvas.style.height=canvasHeight+"px";

    heartCtx.setTransform(canvasDPR,0,0,canvasDPR,0,0);
    paintHearts();
}

function getHeartDimensions(){
    const width=Math.min(76,Math.max(55,canvasWidth*.065));
    const height=width*.92;
    const gap=Math.max(8,width*.17);

    return{
        width,height,gap,
        left:Math.max(14,canvasWidth*.025),
        bottom:Math.max(17,canvasHeight*.028)
    };
}

function getHeartPosition(index){
    const d=getHeartDimensions();

    return{
        x:d.left+index*(d.width+d.gap),
        y:canvasHeight-d.bottom-d.height,
        width:d.width,
        height:d.height
    };
}

function makeHeartPath(x,y,w,h){
    const path=new Path2D();

    path.moveTo(x+w*.5,y+h*.96);
    path.bezierCurveTo(x+w*.16,y+h*.70,x-w*.04,y+h*.42,x+w*.09,y+h*.20);
    path.bezierCurveTo(x+w*.22,y-.02*h,x+w*.45,y+h*.06,x+w*.5,y+h*.29);
    path.bezierCurveTo(x+w*.55,y+h*.06,x+w*.78,y-.02*h,x+w*.91,y+h*.20);
    path.bezierCurveTo(x+w*1.04,y+h*.42,x+w*.84,y+h*.70,x+w*.5,y+h*.96);
    path.closePath();

    return path;
}

function drawHeart(x,y,w,h){
    const path=makeHeartPath(x,y,w,h);

    heartCtx.save();
    heartCtx.fillStyle="#ed263e";
    heartCtx.fill(path);
    heartCtx.lineWidth=Math.max(1.5,w*.045);
    heartCtx.strokeStyle="#751626";
    heartCtx.stroke(path);
    heartCtx.restore();
}

function createHeartShardImages(w,h,count=9){
    const cacheKey=`${Math.round(w)}x${Math.round(h)}_${count}`;

    if(heartShardCache.has(cacheKey)){
        return heartShardCache.get(cacheKey);
    }

    const output=[];
    const cx=w/2;
    const cy=h/2;
    const radius=Math.max(w,h)*3;
    const heart=makeHeartPath(0,0,w,h);

    for(let i=0;i<count;i++){
        const a1=(i/count)*Math.PI*2;
        const a2=((i+1)/count)*Math.PI*2;

        const p1={
            x:cx+Math.cos(a1)*radius,
            y:cy+Math.sin(a1)*radius
        };

        const p2={
            x:cx+Math.cos(a2)*radius,
            y:cy+Math.sin(a2)*radius
        };

        const shard=document.createElement("canvas");
        shard.width=Math.ceil(w*2);
        shard.height=Math.ceil(h*2);

        const ctx=shard.getContext("2d");
        ctx.setTransform(2,0,0,2,0,0);
        ctx.save();
        ctx.clip(heart);
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.lineTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.closePath();
        ctx.clip();
        ctx.fillStyle=i%2===0?"#ed263e":"#ce1933";
        ctx.fillRect(0,0,w,h);
        ctx.restore();

        output.push(shard);
    }

    heartShardCache.set(cacheKey,output);
    return output;
}

function spawnHeartBreak(index){
    if(index<0||index>=3||!heartsAlive[index])return;

    heartsAlive[index]=false;

    const pos=getHeartPosition(index);
    const cx=pos.x+pos.width/2;
    const cy=pos.y+pos.height/2;
    const shards=createHeartShardImages(pos.width,pos.height,9);

    shards.forEach((image,i)=>{
        const angle=(i/shards.length)*Math.PI*2;
        const speed=100+Math.random()*180;

        heartFragments.push({
            image,
            x:cx,
            y:cy,
            vx:Math.cos(angle)*speed+(Math.random()-.5)*100,
            vy:Math.sin(angle)*speed-180-Math.random()*140,
            rotation:(Math.random()-.5)*.8,
            angularVelocity:(Math.random()-.5)*15,
            width:pos.width,
            height:pos.height,
            age:0,
            opacity:1
        });
    });

    paintHearts();
    startHeartPhysics();
}

function paintHearts(){
    heartCtx.clearRect(0,0,canvasWidth,canvasHeight);

    if(currentScene===2){
        heartsAlive.forEach((alive,index)=>{
            if(!alive)return;

            const p=getHeartPosition(index);
            drawHeart(p.x,p.y,p.width,p.height);
        });
    }

    heartFragments.forEach(p=>{
        heartCtx.save();
        heartCtx.globalAlpha=p.opacity??1;
        heartCtx.translate(p.x,p.y);
        heartCtx.rotate(p.rotation);
        heartCtx.drawImage(p.image,-p.width/2,-p.height/2,p.width,p.height);
        heartCtx.restore();
    });
}

function startHeartPhysics(){
    if(heartAnimationFrame!==null)return;

    lastHeartFrame=0;
    heartAnimationFrame=requestAnimationFrame(updateHeartPhysics);
}

function updateHeartPhysics(timestamp){
    const dt=lastHeartFrame?Math.min((timestamp-lastHeartFrame)/1000,.035):.016;
    lastHeartFrame=timestamp;

    const gravity=1500;
    const floor=canvasHeight-3;

    for(let i=heartFragments.length-1;i>=0;i--){
        const p=heartFragments[i];

        p.age+=dt;
        p.vy+=gravity*dt;
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.rotation+=p.angularVelocity*dt;

        if(p.y+p.height/2>floor){
            p.y=floor-p.height/2;

            if(Math.abs(p.vy)>65)p.vy*=-.27;
            else p.vy=0;

            p.vx*=.73;
            p.angularVelocity*=.70;
        }

        p.opacity=p.age>2.1?Math.max(0,1-(p.age-2.1)/1.2):1;

        if(p.age>3.3)heartFragments.splice(i,1);
    }

    paintHearts();

    if(heartFragments.length>0){
        heartAnimationFrame=requestAnimationFrame(updateHeartPhysics);
    }else{
        heartAnimationFrame=null;
        lastHeartFrame=0;
    }
}

function resetHeartEffects(){
    heartsAlive=[true,true,true];
    heartFragments=[];

    if(heartAnimationFrame!==null){
        cancelAnimationFrame(heartAnimationFrame);
        heartAnimationFrame=null;
    }

    lastHeartFrame=0;
    paintHearts();
}

resizeHeartCanvas();

    hideSpecialEvent();

    playerAnswers.push({
        question:"screw you",
        selected:"Special question",
        correct:"Special question",
        special:true
    });

    questionsCompleted++;
    updateQuestionCounter();

    if(lives<=0){
        endGame(false);
        return;
    }

    nextQuestion();
}


/* =====================================================
   TIMER
===================================================== */

function formatTime(seconds){
    const minutes=Math.floor(seconds/60);
    const secs=seconds%60;

    return String(minutes).padStart(2,"0")+":"+String(secs).padStart(2,"0");
}

function updateTimerDisplay(){
    timerText.textContent=formatTime(remainingSeconds);
    timerText.classList.toggle("urgent",remainingSeconds<=15);
}

function startTimer(){
    stopTimer();

    remainingSeconds=CONFIG.timeLimit;
    deadline=Date.now()+CONFIG.timeLimit*1000;

    updateTimerDisplay();

    timerInterval=setInterval(()=>{
        if(gameEnded)return;

        remainingSeconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));
        updateTimerDisplay();

        if(remainingSeconds<=0)endGame(false);
    },100);
}

function stopTimer(){
    if(timerInterval!==null){
        clearInterval(timerInterval);
        timerInterval=null;
    }
}


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(world){
    stopTimer();

    deathSequenceToken++;
    document.getElementById("jumpscareOverlay").style.display="none";

    stopJumpscareSound();
    stopHurtSound();
    hideSpecialEvent();
    stopDeathMusic();

    currentWorld=world;
    const runQuestionCount=Math.min(CONFIG.questionsPerRun,QUESTION_BANK.length);
    quizQuestions=shuffle(QUESTION_BANK).slice(0,runQuestionCount);

    questionIndex=0;
    questionsCompleted=0;
    score=0;
    lives=CONFIG.startingLives;
    selectedAnswer=null;
    gameEnded=false;
    playerAnswers=[];

    specialEventUsed=false;

    resetHeartEffects();

    endingScene.classList.remove("deathVisible");
    deathPanel.style.display="none";
    successPanel.style.display="none";
    document.getElementById("endingButtons").style.display="flex";

    startMusic();
    renderQuestion();
    updateQuestionCounter();
    moveCamera(2);
    paintHearts();
    startTimer();
}


/* =====================================================
   QUESTION COUNTER AND RENDER
===================================================== */

function updateQuestionCounter(){
    questionCounter.textContent=`${questionsCompleted}/${quizQuestions.length}`;
}

function renderQuestion(){
    selectedAnswer=null;

    const question=quizQuestions[questionIndex];

    if(question.secret){
        questionText.textContent="screw you";

        questionMedia.innerHTML="";

        const image=document.createElement("img");
        image.src=CONFIG.images.secretFace;
        image.alt="Secret question image";
        image.loading="eager";
        image.referrerPolicy="no-referrer";

        image.onerror=()=>{
            questionMedia.style.display="none";
            questionMedia.innerHTML="";
        };

        questionMedia.appendChild(image);
        questionMedia.style.display="block";

        answerGrid.innerHTML="";
        answerGrid.style.display="none";

        updateQuestionCounter();

        void runSecretQuestion();
        return;
    }

    answerGrid.style.display="grid";

    questionText.textContent=question.question;
    questionText.style.fontSize=question.topic==="Reading"
        ?"clamp(13px,1.65vw,18px)"
        :"";

    questionText.style.lineHeight=question.topic==="Reading"
        ?"1.45"
        :"1.35";

    questionMedia.innerHTML="";
    questionMedia.style.display="none";

    if(question.image){
        const image=document.createElement("img");
        image.src=question.image;
        image.alt=question.imageAlt||"Question image";
        image.loading="eager";
        image.referrerPolicy="no-referrer";

        image.onerror=()=>{
            questionMedia.style.display="none";
            questionMedia.innerHTML="";
        };

        questionMedia.appendChild(image);
        questionMedia.style.display="block";
    }

    answerGrid.innerHTML="";

    shuffle(question.choices).forEach(option=>{
        const button=document.createElement("button");
        button.className="answerButton";

        const label=document.createElement("span");
        label.className="answerLabel";
        label.textContent=option;

        button.appendChild(label);
        button.addEventListener("click",()=>chooseAnswer(option,button));

        answerGrid.appendChild(button);
    });

    updateQuestionCounter();
}

function replaceButtonWithImage(button,filename,altText){
    const oldImage=button.querySelector(".answerFeedbackImage");
    if(oldImage)oldImage.remove();

    const image=document.createElement("img");
    image.className="answerFeedbackImage";
    image.src=filename;
    image.alt=altText;
    image.draggable=false;

    button.appendChild(image);
}


/* =====================================================
   ANSWER HANDLING
===================================================== */

async function chooseAnswer(answer,clickedButton){
    if(selectedAnswer!==null||gameEnded)return;

    selectedAnswer=answer;

    const question=quizQuestions[questionIndex];

    playerAnswers.push({
        question:question.question,
        selected:answer,
        correct:question.answer
    });

    answerGrid.querySelectorAll(".answerButton").forEach(button=>{
        button.disabled=true;
    });

    const isCorrect=answer===question.answer;

    if(isCorrect){
        score++;

        replaceButtonWithImage(
            clickedButton,
            CONFIG.images.correct,
            "Correct"
        );

        await Promise.all([
            playSoundAndWait(CONFIG.sounds.correct,CONFIG.correctVolume),
            delay(CONFIG.correctFeedbackTime)
        ]);

    }else{
        const brokenHeartIndex=lives-1;

        lives--;

        replaceButtonWithImage(
            clickedButton,
            CONFIG.images.wrong,
            "Wrong"
        );

        /*
           Play the wrong sound without blocking the game
           until the entire audio file finishes.
           The original 500ms delay is unchanged.
        */
        playSound(CONFIG.sounds.wrong,CONFIG.wrongVolume);

        await delay(CONFIG.wrongSoundDelay);
        if(gameEnded)return;

        spawnHeartBreak(brokenHeartIndex);

        /*
           Play the heart sounds concurrently.
           Keep the original 650ms feedback delay unchanged.
        */
        playSound(CONFIG.sounds.heartSmash);
        playSound(CONFIG.sounds.loseMock);

        await delay(CONFIG.wrongFeedbackTime);
    }

    if(gameEnded)return;

    questionsCompleted++;
    updateQuestionCounter();

    if(lives<=0){
        endGame(false);
        return;
    }

    /*
       SECRET CHANCE:
       Evaluated after either a correct OR wrong answer.
       It only triggers when more than one life remains.
    */
    const hasNextQuestion=questionIndex<quizQuestions.length-1;

    const triggerSecret=
        lives>1&&
        hasNextQuestion&&
        !specialEventUsed&&
        Math.random()<CONFIG.secretChance;

    if(triggerSecret){
        specialEventUsed=true;
        quizQuestions[questionIndex+1]=createSecretQuestion();
    }

    nextQuestion();
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){
    if(gameEnded)return;

    questionIndex++;

    if(questionIndex>=quizQuestions.length){
        endGame(true);
        return;
    }

    renderQuestion();
}


/* =====================================================
   ANSWER REVIEW
===================================================== */

function renderAnswerReview(){
    const results=document.getElementById("answerResults");
    results.innerHTML="";

    playerAnswers.forEach((item,index)=>{
        const entry=document.createElement("div");
        entry.className="resultItem";

        if(item.special){
            const q=document.createElement("div");
            q.className="resultQuestion";
            q.textContent=`${index+1}. screw you`;

            const special=document.createElement("div");
            special.className="resultYourAnswer";
            special.textContent="Special question";

            entry.append(q,special);
            results.appendChild(entry);
            return;
        }

        if(item.selected!==item.correct){
            entry.classList.add("incorrect");
        }

        const q=document.createElement("div");
        q.className="resultQuestion";
        q.textContent=`${index+1}. ${item.question}`;

        const yours=document.createElement("div");
        yours.className="resultYourAnswer";
        yours.textContent=`Your answer: ${item.selected}`;

        const correct=document.createElement("div");
        correct.className="resultCorrectAnswer";
        correct.textContent=`Correct answer: ${item.correct}`;

        entry.append(q,yours,correct);
        results.appendChild(entry);
    });
}


/* =====================================================
   END GAME
===================================================== */

function endGame(survived){
    if(gameEnded)return;

    gameEnded=true;

    stopTimer();
    hideSpecialEvent();
    stopMusic();
    stopDeathMusic();
    stopHurtSound();

    endingScene.classList.remove("deathVisible");
    deathPanel.style.display="none";
    successPanel.style.display="none";

    document.getElementById("endingButtons").style.display="flex";

    if(survived){
        successPanel.style.display="block";
        renderAnswerReview();
        moveCamera(3);
    }else{
        showDeathAfterJumpscare();
    }
}

async function showDeathAfterJumpscare(){
    const token=++deathSequenceToken;

    await playJumpscare();

    if(token!==deathSequenceToken)return;

    deathPanel.style.display="block";

    document.getElementById("civilianImage").src=CONFIG.images.civilian;
    document.getElementById("deathTitle").textContent="YOU DIED";
    document.getElementById("deathMessage").textContent=randomItem(CONFIG.deathMessages);

    startDeathMusic();
    playRandomHurtSound();

    void endingScene.offsetWidth;
    endingScene.classList.add("deathVisible");

    moveCamera(3);
}


/* =====================================================
   END SCREEN BUTTONS
===================================================== */

document.getElementById("retryButton").addEventListener("click",()=>{
    if(currentWorld)startQuiz(currentWorld);
});

document.getElementById("homeButton").addEventListener("click",()=>{
    stopTimer();

    deathSequenceToken++;

    document.getElementById("jumpscareOverlay").style.display="none";

    stopJumpscareSound();
    stopHurtSound();
    stopMusic();
    stopDeathMusic();
    hideSpecialEvent();

    gameEnded=false;

    resetHeartEffects();

    endingScene.classList.remove("deathVisible");
    deathPanel.style.display="none";
    successPanel.style.display="none";

    moveCamera(0);
});


/* =====================================================
   INITIALIZATION
===================================================== */

moveCamera(0);
resetHeartEffects();

console.log("Slop Quiz loaded.");
console.log("Question bank:",QUESTION_BANK.length);
console.log("Category counts:",categoryCounts);
console.log("Picture questions:",QUESTION_BANK.filter(q=>q.image).length);
console.log("Questions per game:",Math.min(CONFIG.questionsPerRun,QUESTION_BANK.length));
console.log("Lives:",CONFIG.startingLives);
console.log("Timer:",CONFIG.timeLimit);

</script>
